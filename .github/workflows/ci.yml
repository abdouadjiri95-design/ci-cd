name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest tests.test_grades -v

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate report
        run: echo "Rapport de notes généré par la CI" > report.txt
      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: report
      - name: Show report
        run: cat report.txt
